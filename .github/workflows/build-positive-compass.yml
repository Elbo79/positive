name: Build Positive Compass APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_positive_compass/**'
      - '.github/workflows/build-positive-compass.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_positive_compass
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android .
      - name: Get dependencies
        run: flutter pub get
      - name: Build installable APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Positive-Compass-Android-APK
          path: flutter_positive_compass/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
